<?xml version="1.0" encoding="UTF-8"?>
<!--
  CARTÃO DE VISITA — VERSO
  Dimensões finais: 90 × 50 mm
  Com sangria (3mm): 96 × 56 mm
  Exportar para PDF em 300 DPI antes de enviar à gráfica
  ──────────────────────────────────────────────────────
  ⚠ QR CODE: substituir o placeholder abaixo por um QR
    real gerado em https://qr.io  ou  https://qrcode-monkey.com
    para a URL: https://www.carraraalumiglass.com.br
    Exportar como SVG ou PNG (mín. 400×400 px) e embedar aqui.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#030609"/>
      <stop offset="55%"  stop-color="#060d1c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="rgba(59,130,246,0.055)" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glowC" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.1)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <!-- QR data fill pattern (checkerboard 6px, looks like QR modules) -->
    <pattern id="qrfill" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="6" fill="#111"/>
      <rect x="6" y="6" width="6" height="6" fill="#111"/>
    </pattern>
    <!-- Instagram gradient -->
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f09433"/>
      <stop offset="25%"  stop-color="#e6683c"/>
      <stop offset="50%"  stop-color="#dc2743"/>
      <stop offset="75%"  stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
    <clipPath id="card"><rect width="1050" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- ── BACKGROUND ── -->
    <rect width="1050" height="600" fill="url(#bgGrad)"/>
    <rect width="1050" height="600" fill="url(#grid)"/>
    <rect width="1050" height="600" fill="url(#glowC)"/>

    <!-- ── DECORATIVE VERTICAL STRIPE (right, mirror da frente) ── -->
    <rect x="1044" y="0" width="6" height="600" fill="#3b82f6" opacity="0.7"/>

    <!-- ── TOP BRAND (muted) ── -->
    <line x1="36" y1="66" x2="1014" y2="66"
          stroke="rgba(59,130,246,0.07)" stroke-width="0.5"/>
    <text x="525" y="56"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="18" fill="rgba(122,171,208,0.28)"
      text-anchor="middle" letter-spacing="10">CARRARA ALUMIGLASS</text>

    <!-- ── CORNER BRACKETS ── -->
    <path d="M 52,76 L 52,46 L 82,46"   stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
    <path d="M 968,46 L 998,46 L 998,76" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
    <path d="M 52,524 L 52,554 L 82,554" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>
    <path d="M 968,554 L 998,554 L 998,524" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" fill="none"/>

    <!-- ═══════════════════════════════════════════════
         CONTATOS — CENTRO
    ═══════════════════════════════════════════════ -->

    <!-- ── WHATSAPP BLOCK ── -->
    <!-- Icon circle -->
    <circle cx="390" cy="218" r="34" fill="rgba(37,211,102,0.12)" stroke="#25D366" stroke-width="2"/>
    <!-- WhatsApp phone path scaled ~2.5x, centered in circle -->
    <g transform="translate(375.5,203.5) scale(1.22)">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"
            fill="#25D366"/>
    </g>
    <!-- Label -->
    <text x="440" y="206"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="rgba(59,130,246,0.65)"
      letter-spacing="5">WHATSAPP</text>
    <!-- Number -->
    <text x="438" y="246"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="46" fill="#edf2ff"
      letter-spacing="2" font-weight="300">(11) 98933-4712</text>

    <!-- ── HORIZONTAL DIVIDER ── -->
    <line x1="390" y1="286" x2="520" y2="286"
          stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <line x1="520" y1="286" x2="760" y2="286"
          stroke="rgba(59,130,246,0.2)" stroke-width="1"/>

    <!-- ── INSTAGRAM BLOCK ── -->
    <!-- Icon rounded square -->
    <rect x="356" y="316" width="68" height="68" rx="18"
          fill="rgba(188,24,136,0.1)" stroke="url(#igGrad)" stroke-width="2.2"/>
    <!-- Camera lens -->
    <circle cx="390" cy="350" r="16" fill="none" stroke="url(#igGrad)" stroke-width="2.2"/>
    <!-- Viewfinder dot -->
    <circle cx="390" cy="350" r="5" fill="url(#igGrad)"/>
    <!-- Flash dot -->
    <circle cx="410" cy="330" r="4.5" fill="url(#igGrad)"/>

    <!-- Label -->
    <text x="440" y="338"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16" fill="rgba(204,35,102,0.8)"
      letter-spacing="5">INSTAGRAM</text>
    <!-- Handle -->
    <text x="438" y="380"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="44" fill="#edf2ff"
      letter-spacing="1" font-weight="300">@carraraalumiglass</text>

    <!-- ── BOTTOM SEPARATOR ── -->
    <line x1="36" y1="495" x2="1014" y2="495"
          stroke="rgba(59,130,246,0.14)" stroke-width="1"/>

    <!-- ═══════════════════════════════════════════════
         QR CODE — CANTO INFERIOR ESQUERDO
         ⚠ Substituir pelo QR real antes de imprimir
    ═══════════════════════════════════════════════ -->

    <!-- White QR background zone -->
    <rect x="52" y="408" width="152" height="152" rx="5" fill="white"/>

    <!-- ── QR DATA FILL (checkerboard, aparência de módulos) ── -->
    <rect x="64" y="420" width="128" height="128" fill="url(#qrfill)"/>

    <!-- ── CLEAR FINDER AREAS ── -->
    <!-- TL area + separator -->
    <rect x="64" y="420" width="50" height="50" fill="white"/>
    <!-- TR area + separator -->
    <rect x="142" y="420" width="50" height="50" fill="white"/>
    <!-- BL area + separator -->
    <rect x="64" y="498" width="50" height="50" fill="white"/>

    <!-- ── FINDER PATTERN TL ── -->
    <rect x="64"  y="420" width="42" height="42" fill="#111"/>
    <rect x="70"  y="426" width="30" height="30" fill="white"/>
    <rect x="76"  y="432" width="18" height="18" fill="#111"/>
    <!-- ── FINDER PATTERN TR ── -->
    <rect x="144" y="420" width="42" height="42" fill="#111"/>
    <rect x="150" y="426" width="30" height="30" fill="white"/>
    <rect x="156" y="432" width="18" height="18" fill="#111"/>
    <!-- ── FINDER PATTERN BL ── -->
    <rect x="64"  y="500" width="42" height="42" fill="#111"/>
    <rect x="70"  y="506" width="30" height="30" fill="white"/>
    <rect x="76"  y="512" width="18" height="18" fill="#111"/>

    <!-- ── TIMING MODULES (row 6 between TL/TR, col 6 between TL/BL) ── -->
    <!-- Horizontal timing: y=420+36=456, clear alternate cells -->
    <rect x="112" y="456" width="6" height="6" fill="white"/>
    <rect x="124" y="456" width="6" height="6" fill="white"/>
    <!-- Vertical timing: x=64+36=100, clear alternate cells -->
    <rect x="100" y="472" width="6" height="6" fill="white"/>
    <rect x="100" y="484" width="6" height="6" fill="white"/>

    <!-- ── ALIGNMENT PATTERN (center area, version 2+) ── -->
    <rect x="138" y="496" width="18" height="18" fill="#111"/>
    <rect x="141" y="499" width="12" height="12" fill="white"/>
    <rect x="144" y="502" width="6"  height="6"  fill="#111"/>

    <!-- ── QR LABEL ── -->
    <text x="128" y="575"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15" fill="rgba(122,171,208,0.55)"
      text-anchor="middle" letter-spacing="2">Acesse nosso site</text>

    <!-- ── BOTTOM RIGHT: Website small ── -->
    <text x="986" y="542"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17" fill="rgba(58,92,126,0.6)"
      text-anchor="end" letter-spacing="2">carraraalumiglass.com.br</text>

    <!-- ── BOTTOM LINES ── -->
    <line x1="36" y1="564" x2="1014" y2="564"
          stroke="rgba(59,130,246,0.07)" stroke-width="0.5"/>
  </g>
</svg>
